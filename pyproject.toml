[project]
name = "lab-pytorch-v1"
version = "0.1.0"
description = "TP PyTorch sur MNIST : classification, auto-encodeur et VAE"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ipykernel",
    "matplotlib",
    "torch",
    "torcheval",
    "torchvision",
]

[project.scripts]
lab-pytorch-v1 = "lab_pytorch_v1:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
